# exchange_server settings. Any of these can also be overridden on the
# command line: exchange_server --config config/exchange.conf --set port=9100

# Network. Any address other than 127.x.x.x needs auth_file.
listen_address = 127.0.0.1
port = 9000                          # 0 picks a free port (printed at startup)

# Symbols traded (up to 8 characters each)
symbols = AAPL, MSFT, GOOG

# Engine capacities per symbol: small (65k live orders, ~26 MB), medium (262k,
# ~105 MB), or large (1M, ~335 MB).
# Recorded in the journal; a journal can only be replayed with the same profile.
capacity_profile = small

# Journal of every sequenced request; replayed on startup to recover the book.
# Leave empty to run without recovery.
journal_path = data/exchange.journal
# batch: fsync each batch before matching it (nothing is acknowledged before
#        it is on disk). none: faster; survives a process crash, not power loss.
journal_fsync = batch

# Risk checks applied by the gateway before an order reaches the engine
max_order_qty = 10000
max_notional = 0                     # currency units, 0 = off
price_band_percent = 10              # max distance from last trade, 0 = off;
                                     # also caps how far market orders sweep
tick_size = 0.01                     # every price is a multiple of this
max_open_orders_per_participant = 10000
cancel_on_disconnect = false

# Participant secrets, one '<participant> <secret>' line each (16 to 32
# characters). Must be chmod 600. Empty: logins are trusted, loopback only.
auth_file =

# Print latency and throughput metrics this often (0 = only at shutdown)
metrics_interval_seconds = 10
